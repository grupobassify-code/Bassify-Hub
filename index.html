<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      // Gracefully ignore benign dev-server WebSocket HMR rejections in Cloud Run iframe
      window.addEventListener('unhandledrejection', function(event) {
        var reason = event && event.reason;
        var msg = (reason && reason.message) || String(reason || '');
        var stack = (reason && reason.stack) || '';
        if (
          msg.indexOf('WebSocket') !== -1 ||
          msg.indexOf('vite:ws') !== -1 ||
          stack.indexOf('@vite/client') !== -1
        ) {
          event.preventDefault();
          event.stopImmediatePropagation();
        }
      });
      window.addEventListener('error', function(event) {
        var msg = (event && event.message) || '';
        var filename = (event && event.filename) || '';
        if (
          msg.indexOf('WebSocket') !== -1 ||
          filename.indexOf('@vite/client') !== -1
        ) {
          event.preventDefault();
          event.stopImmediatePropagation();
        }
      });
    </script>
    <title>Bassify Play — Red Social & Store</title>
    <meta name="description" content="Mini red social estilo Discord y tienda de juegos, apps, noticias y eventos con gestión administrativa y estética PlayStation azul y blanco." />
    <meta property="og:title" content="Bassify Play — Red Social & Store" />
    <meta property="og:description" content="Mini red social estilo Discord y tienda de juegos, apps, noticias y eventos con gestión administrativa y estética PlayStation azul y blanco." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
